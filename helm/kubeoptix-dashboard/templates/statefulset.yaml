{{- if not .Values.buildOnly }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubeoptix-dashboard
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: kubeoptix-dashboard
    app.kubernetes.io/part-of: kubeoptix
spec:
  serviceName: kubeoptix-dashboard
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeoptix-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeoptix-dashboard
        app.kubernetes.io/part-of: kubeoptix
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"kubeoptix-dashboard:latest","namespace":"shiftwise-ai"},"fieldPath":"spec.template.spec.containers[?(@.name==\"dashboard\")].image"}]
    spec:
      serviceAccountName: kubeoptix-dashboard
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/shiftwise-ai/kubeoptix-dashboard:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: kubeoptix-dashboard-env
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubeoptix-dashboard-oauth-cookie
                  key: session-secret
            - name: DASHBOARD_BIND_HOST
              value: 127.0.0.1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth2/healthz
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /oauth2/healthz
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --openshift-service-account=kubeoptix-dashboard
            - --upstream=http://127.0.0.1:8080
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --proxy-prefix=/oauth2
            - --skip-provider-button=true
            - --pass-user-headers=true
            - --pass-access-token=false
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --cookie-secure=true
            - --cookie-samesite=lax
            {{- if .Values.oauthProxy.routeHost }}
            - --redirect-url=https://{{ .Values.oauthProxy.routeHost }}/oauth2/callback
            {{- end }}
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubeoptix-dashboard-oauth-cookie
                  key: cookie-secret
          ports:
            - name: oauth-http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth2/healthz
              port: oauth-http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
{{- end }}
