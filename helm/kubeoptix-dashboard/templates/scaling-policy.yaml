{{- if not .Values.buildOnly }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubeoptix-dashboard-single-replica
  labels:
    app.kubernetes.io/name: kubeoptix-dashboard
    app.kubernetes.io/part-of: kubeoptix
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - statefulsets
          - statefulsets/scale
        scope: Namespaced
  matchConditions:
    - name: kubeoptix-dashboard-only
      expression: object.metadata.name == 'kubeoptix-dashboard'
  validations:
    - expression: has(object.spec.replicas) && object.spec.replicas == 1
      message: The kubeoptix-dashboard StatefulSet must run with exactly one replica.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubeoptix-dashboard-single-replica
  labels:
    app.kubernetes.io/name: kubeoptix-dashboard
    app.kubernetes.io/part-of: kubeoptix
spec:
  policyName: kubeoptix-dashboard-single-replica
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shiftwise-ai
{{- end }}
