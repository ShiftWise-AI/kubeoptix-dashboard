{{- if not .Values.buildOnly }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeoptix-dashboard-env
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: kubeoptix-dashboard
    app.kubernetes.io/part-of: kubeoptix
data:
{{- $environmentFile := required "environmentFile must contain the .env.openshift file" .Values.environmentFile }}
{{- range $line := splitList "\n" $environmentFile }}
{{- if and $line (not (hasPrefix "#" $line)) }}
{{- $parts := regexSplit "=" $line 2 }}
  {{ index $parts 0 }}: {{ index $parts 1 | quote }}
{{- end }}
{{- end }}
{{- end }}
