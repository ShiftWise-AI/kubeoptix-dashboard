{{- if not .Values.buildOnly }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubeoptix-dashboard
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: kubeoptix-dashboard
    app.kubernetes.io/part-of: kubeoptix
spec:
  to:
    kind: Service
    name: kubeoptix-dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
