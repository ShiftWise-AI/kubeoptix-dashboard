name: Publish image to Quay

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Full main merge commit SHA to resume (empty uses current main)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-flow:
    uses: ./.github/workflows/branch-limits.yml

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate workflows
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -ignore '^unexpected key "queue" for "concurrency" section\.' .github/workflows/*.yml
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run SAST
        run: |
          python -m pip install 'semgrep==1.181.0'
          semgrep scan --config p/security-audit --error --strict --metrics=off
      - name: Scan source and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,.venv,target,node_modules,.cache
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build validation image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          load: true
          tags: kubeoptix-dashboard:check
      - name: Require non-root runtime
        run: |
          user="$(docker image inspect kubeoptix-dashboard:check --format '{{.Config.User}}')"
          [[ -n "$user" && "${user%%:*}" != 0 && "${user%%:*}" != root ]]
      - name: Scan validation image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          version: v0.69.3
          image-ref: kubeoptix-dashboard:check
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

  ci-required:
    if: always()
    needs: [branch-flow, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          BRANCH_FLOW: ${{ needs.branch-flow.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: test "$BRANCH_FLOW" = success && test "$VALIDATE" = success

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: quay-release
    concurrency:
      group: dashboard-production-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
    env:
      IMAGE: quay.io/parraes/kubeoptix-dashboard
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check credentials before reserving a release
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          for name in QUAY_USERNAME QUAY_PASSWORD OPERATOR_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
      - name: Configure release identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reserve or resume version
        id: release
        env:
          SOURCE: ${{ inputs.source || github.sha }}
        run: node scripts/ci_pipeline.mjs reserve --source "$SOURCE"
      - name: Test exact versioned source
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Look for previously published immutable image
        id: existing
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            docker pull "$IMAGE:$VERSION"
            revision="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            version="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
            [[ "$revision" == "$SOURCE" && "$version" == "$VERSION" ]] || { echo '::error::Existing image provenance mismatch'; exit 1; }
            echo 'found=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/manifest-error"; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Cannot query Quay; refusing to overwrite a release'
            exit 1
          fi
      - name: Build versioned image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          load: true
          tags: quay.io/parraes/kubeoptix-dashboard:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
      - name: Require non-root release image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          user="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Config.User}}')"
          [[ -n "$user" && "${user%%:*}" != 0 && "${user%%:*}" != root ]]
      - name: Scan exact release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          version: v0.69.3
          image-ref: quay.io/parraes/kubeoptix-dashboard:${{ steps.release.outputs.version }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Publish and verify remote digest
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
          EXISTS: ${{ steps.existing.outputs.found }}
        run: |
          if [[ "$EXISTS" != true ]]; then docker push "$IMAGE:$VERSION"; fi
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE:$VERSION@$digest"
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$SOURCE"
          docker push "$IMAGE:sha-$SOURCE"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          git fetch origin main --tags
          highest="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)"
          current=false
          if [[ "$(git rev-parse origin/main)" == "$SOURCE" && "$highest" == "v$VERSION" ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            [[ "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" == "$digest" ]]
            current=true
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Check out Operator for an isolated update PR
        if: steps.published.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ShiftWise-AI/kubeoptix-operator
          ref: main
          path: operator
          token: ${{ secrets.OPERATOR_TOKEN }}
      - name: Set up Go for Operator validation
        if: steps.published.outputs.current == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Open or resume validated Operator PR
        if: steps.published.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: node scripts/ci_pipeline.mjs operator --version "$VERSION" --digest "$DIGEST"